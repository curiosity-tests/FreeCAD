# This is a generic wrapup workflow that only aims at gathering reports and ...
# ... presenting them as a unified summary
#
# It expects steps to be summarized to be presented a JSON input formatted ...
# ... as the "needs" context of Github :
# https://docs.github.com/en/actions/learn-github-actions/contexts#needs-context
# In addition to standard "result", each step shall have a string entry in "outputs" ...
# ... named "reportFile" containing the name of the corresponding report. The ...
# ... report file shall be available in an artifact with the same name.

name: WrapUp
on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      previousSteps:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:

  WrapUp:
    runs-on: ubuntu-latest
    env:
      artifactsDownloadDir: /tmp/artifacts/
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920   # v2.20.0
      with:
        egress-policy: audit

    - name: Make needed directories, files and initializations
      run: |
        mkdir -p ${{ env.artifactsDownloadDir }}
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
        path: ${{ env.artifactsDownloadDir }}
    - name: Save input data to file
      run: |
        cat > data << "EOD"
        ${{ inputs.previousSteps }}
        EOD
    - name: Compute the report
      run: |
        echo "usedArtifacts<<EOD" >> $GITHUB_ENV
        for step in $(jq -r "keys_unsorted | .[]" data)
        do
          echo "Processing step $step"
          result=$(jq -r ".\"$step\".result" data)
          icon=":heavy_check_mark:"
          if [ $result == 'failure' ]
          then
            icon=":x:"
          elif [ $result == 'cancelled' ]
          then
            icon=":no_entry_sign:"
          elif [ $result == 'skipped' ]
          then
            icon=":white_check_mark:"
          fi
          echo "### $icon $step step" >> report.md
          if [ $result == 'skipped' ]
          then
            echo "Step was skipped, no report was generated" | tee -a report.md
            continue
          elif [ $result == 'cancelled' ]
          then
            echo "Step was cancelled when executing, report may be incomplete" | tee -a report.md
          fi
          report=$(jq -r ".\"$step\".outputs.reportFile" data)
          if [ $report ]
          then
            echo "Report for step $step is $report"
            echo "$report" >> $GITHUB_ENV
            if [ $(find ${{ env.artifactsDownloadDir }} -type f -name $report | wc -l) -eq 1 ]
            then
              find ${{ env.artifactsDownloadDir }} -type f -name $report -exec cat {} \; >> report.md
            else
              echo "No or several files found for report $report, not printing" | tee -a report.md
              echo "Below files found :"
              find ${{ env.artifactsDownloadDir }} -type f -name $report
            fi
          else
            echo "Report file was not set by step $step" | tee -a report.md
          fi
          echo "" >> report.md
        done
        echo "EOD" >> $GITHUB_ENV
        cat report.md >> $GITHUB_STEP_SUMMARY
    - name: Delete used artifacts
      continue-on-error: true
      uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118   # v6.0.0
      with:
        name: |
          ${{ env.usedArtifacts }}
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
