# This is the primary CI workflow for FreeCAD.
# It runs the always-required jobs (Prepare, Ubuntu, Lint) on every PR
# event except label additions. Label-gated jobs (macOS and Windows
# builds) are in CI_approved.yml with a separate concurrency group so
# that adding a label does not cancel an in-progress Linux build or
# lint run.

name: FreeCAD CI primary

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches:
      - main
      - releases/**
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group: ~

permissions:
  contents: read
  id-token: write

concurrency:
  group: FC-CI-primary-${{ github.head_ref || github.run_id }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "FreeCAD CI primary ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  Prepare:
    uses: ./.github/workflows/sub_prepare.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      artifactBasename: Prepare-${{ github.run_id }}

  Ubuntu:
    needs: [Prepare]
    if: "!startsWith(github.head_ref, 'refs/heads/backport-')"
    uses: ./.github/workflows/sub_buildUbuntu.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      artifactBasename: Ubuntu-${{ github.run_id }}

  Lint:
    needs: [Prepare]
    if: "!startsWith(github.head_ref, 'refs/heads/backport-')"
    uses: ./.github/workflows/sub_lint.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      artifactBasename: Lint-${{ github.run_id }}
      changedFiles: ${{ needs.Prepare.outputs.changedFiles }}
      changedCppFiles: ${{ needs.Prepare.outputs.changedCppFiles }}
      changedCppLines: ${{ needs.Prepare.outputs.changedCppLines }}
      changedPythonFiles: ${{ needs.Prepare.outputs.changedPythonFiles }}

  WrapUp:
    needs: [
        Prepare,
        Ubuntu,
        Lint
      ]
    if: always()
    uses: ./.github/workflows/sub_wrapup.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      previousSteps: ${{ toJSON(needs) }}
